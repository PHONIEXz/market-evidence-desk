name: Build Sanity Studio

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-studio.yml
      - package.json
      - sanity.cli.ts
      - sanity.config.ts
      - 'sanity/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Studio
        run: npm run studio:build
      - name: Check build
        run: test -s dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: sanity-studio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
